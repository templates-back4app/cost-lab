services:
  mongo:
    image: mongo:7
    command: ["--quiet"]
  parse:
    image: parseplatform/parse-server:7.4.0
    depends_on: [mongo]
    ports: ["1340:1337"]
    volumes: ["./on-a-backend/cloud:/parse-server/cloud:ro"]
    environment:
      PARSE_SERVER_APPLICATION_ID: cost-app
      PARSE_SERVER_MASTER_KEY: cost-master-key
      PARSE_SERVER_DATABASE_URI: mongodb://mongo:27017/dev
      PARSE_SERVER_CLOUD: /parse-server/cloud/main.js
      PARSE_SERVER_MASTER_KEY_IPS: "0.0.0.0/0,::/0"
